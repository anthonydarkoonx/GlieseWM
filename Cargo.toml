# GlieseWM: a modular tiling window manager for Metal OS. See PLAN.md.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

# property tests run many cases: optimise them
[profile.test]
opt-level = 2

[profile.release]
panic = "abort"
opt-level = "s"

# The same hardening lints as metal-os.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
