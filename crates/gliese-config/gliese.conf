# gliese.conf: GlieseWM's configuration. This is the built-in default. Your own copy lives at
# /data/programdata/gliesed/gliese.conf (edit it with `nano $GLIESE_CONF` in a terminal); saving it applies it.
# Syntax: `key = value`, `section { ... }`, `$var = value`, `bind = MODS, KEY, dispatcher[, arg]`. '#' starts a comment.

$mod = SUPER

general {
    layout       = dwindle        # dwindle | master
    gaps_in      = 6              # pixels between two tiles
    gaps_out     = 12             # to the screen edge; or four values: top right bottom left
    border_size  = 2
    smart_gaps   = false          # true: a lone window gets no gaps and no border
    col.active_border   = 0xff5e81ac
    col.inactive_border = 0xff3b4252
    col.background      = 0xff2e3440
    reserved     = 0              # edges kept free (1 or 4 values), for a bar someone may add later
}

dwindle {
    split_ratio    = 0.5
    force_split    = 0            # where a new window goes: 0 or 2 second (right/below), 1 first (left/above)
    preserve_split = true
}

master {
    mfact       = 0.55
    nmaster     = 1
    orientation = left            # left | right | top | bottom | center
    new_on_top  = false
}

misc {
    auto_reload = true            # re-apply this file when it is saved
    drop_hidden_buffers = true    # windows on hidden workspaces free their pixels (redrawn when shown)
    max_windows = 256
    buffer_budget_mib = 32
    min_tile = 64                 # below this a workspace stops splitting tiles
}

input {
    follow_mouse = false          # true: focus follows the pointer
}

# per-workspace overrides
# workspace = 9, gaps_in:0, gaps_out:0

# window rules (globs on title or program id)
# windowrule = float, title:*Properties*

# exec-once = terminal          # start a program when the desktop comes up

# --- binds ------------------------------------------------------------------
bind = $mod, Return, exec, terminal           # Super+Enter: a shell window
bind = $mod, Q, killactive
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, J, togglesplit
bind = $mod SHIFT, C, reload

bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT, F4, killactive

bind = $mod, Left,  movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up,    movefocus, u
bind = $mod, Down,  movefocus, d
bind = $mod SHIFT, Left,  movewindow, l
bind = $mod SHIFT, Right, movewindow, r
bind = $mod SHIFT, Up,    movewindow, u
bind = $mod SHIFT, Down,  movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod, Tab, workspace, previous

bind = $mod, equal, setgaps, +2 +4
bind = $mod, minus, setgaps, -2 -4

# mouse: drag with Super held
bindm = $mod, mouse:left, movewindow
bindm = $mod, mouse:right, resizewindow

# resize mode
bind = $mod, R, submap, resize
submap = resize
binde = , Right, resizeactive, 20 0
binde = , Left,  resizeactive, -20 0
binde = , Down,  resizeactive, 0 20
binde = , Up,    resizeactive, 0 -20
bind  = , Escape, submap, reset
submap = reset
