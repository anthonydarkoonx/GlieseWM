[package]
name = "gliese-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GlieseWM's compositor: sessions, windows, double buffers, the configure handshake, input routing, rendering; behind a Host trait"

[features]
# an in-memory host with real protocol clients, for tests and screenshots
sim = ["dep:gliese-client", "std"]
std = []

[dependencies]
gliese-proto = { path = "../gliese-proto" }
gliese-layout = { path = "../gliese-layout" }
# the 5x9 bitmap font (the error bar); the OS Makefile points this at its own copy when it builds a desktop
metal-gfx = { git = "https://github.com/anthonydarkoonx/metal-os", rev = "6406422" }
gliese-client = { path = "../gliese-client", optional = true }

[dev-dependencies]
gliese-client = { path = "../gliese-client" }

[[test]]
name = "sim"
required-features = ["sim"]

[[example]]
name = "screenshot"
required-features = ["sim"]

[lints]
workspace = true
